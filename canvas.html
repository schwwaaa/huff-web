<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>canvas</title>
      <link rel="stylesheet" href="css/canvas.min.css">

</head>
<body>
  <video id="streamOutput" class="output-surface" autoplay muted playsinline aria-label="HUFF canvas output"></video>
  <canvas id="mirror" class="output-surface" aria-label="HUFF canvas output"></canvas>
  <script>
    function qs(name) {
      const q = new URLSearchParams(location.search);
      return q.get(name);
    }

    // The detached canvas window receives frames directly from the main HUFF
    // page through BroadcastChannel. No localhost WebSocket relay is required.
    const MIRROR_CHANNEL_NAME = 'huff-canvas-mirror-v1';
    const autofs = qs('autofs') === '1';
    const fullscreenMode = qs('fullscreen') === '1';
    let autofsTimer = 0;

    const cvs = document.getElementById('mirror');
    const streamOutput = document.getElementById('streamOutput');
    let directStreamActive = false;
    // Keep the backing store at the encoded frame's native dimensions and let
    // CSS/GPU composition scale it to the output window.
    const bitmapCtx = cvs.getContext('bitmaprenderer');
    const ctx = bitmapCtx ? null : cvs.getContext('2d', { alpha:false, desynchronized:true });
    cvs.width = 1;
    cvs.height = 1;

    const embeddedInPip = window.parent !== window && !!window.parent;

    function activeSurface() { return directStreamActive ? streamOutput : cvs; }
    function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    async function togglePopupFullscreen(){
      // Fullscreen targets only the detached output surface. The HUFF controls
      // document is never used as the fullscreen target.
      if (embeddedInPip) return;
      if (isFullscreen()) {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) await ex.call(document);
        return;
      }
      const surface = activeSurface();
      try {
        if (surface.requestFullscreen) {
          try { await surface.requestFullscreen({ navigationUI:'hide' }); }
          catch { await surface.requestFullscreen(); }
        } else if (surface.webkitRequestFullscreen) {
          await surface.webkitRequestFullscreen();
        }
      } catch (e) {
        console.warn('[canvas web] output fullscreen request rejected', e);
      }
    }

    // The HUFF GUI opens this page as the dedicated output window. Browser
    // chrome may remain while windowed. A canvas click or F key can enter true
    // fullscreen on the canvas element; Escape exits through the browser.
    if (!embeddedInPip) {
      if (fullscreenMode) {
        document.addEventListener('click', () => { if (!isFullscreen()) void togglePopupFullscreen(); });
      } else {
        document.addEventListener('dblclick', () => { void togglePopupFullscreen(); });
      }
      document.addEventListener('keydown', e => {
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          void togglePopupFullscreen();
        }
      });
      if (autofs) autofsTimer = setTimeout(() => { autofsTimer = 0; void togglePopupFullscreen(); }, 120);
    }

// Prefer a browser-native canvas MediaStream from the opener. This removes the
// per-frame JPEG encode, Blob transfer, JPEG decode, and bitmap reconstruction
// costs from the normal WINDOW path while keeping the existing encoded transport
// as a fallback for browsers without canvas capture support.
async function tryDirectCanvasStream() {
  if (!window.opener || window.opener.closed) return false;
  try {
    const getStream = window.opener.__huffGetCanvasStream;
    if (typeof getStream !== 'function') return false;
    const stream = getStream();
    if (!stream || typeof stream.getVideoTracks !== 'function' || stream.getVideoTracks().length === 0) return false;
    streamOutput.srcObject = stream;
    streamOutput.muted = true;
    streamOutput.playsInline = true;
    streamOutput.controls = false;
    await streamOutput.play().catch(() => {});
    directStreamActive = true;
    streamOutput.style.display = 'block';
    cvs.style.display = 'none';
    console.log('[canvas web] direct canvas MediaStream active');
    return true;
  } catch (error) {
    console.warn('[canvas web] direct canvas MediaStream unavailable; using encoded fallback', error);
    try { streamOutput.srcObject = null; } catch {}
    directStreamActive = false;
    return false;
  }
}

// ── Pure-browser canvas transport ──────────────────────────────────────────
let channel = null;
let viewerShutdown = false;
let pendingFrame = null; // newest received encoded frame not yet rendered
let decodeBusy = false;  // one decode/draw at a time
let presenceTimer = 0;

function post(message) {
  if (!channel || viewerShutdown) return;
  try { channel.postMessage(message); } catch {}
}

function drainPending() {
  if (viewerShutdown || decodeBusy || pendingFrame == null) return;
  decodeBusy = true;
  const data = pendingFrame;
  pendingFrame = null;
  let blob;
  try {
    blob = data instanceof Blob ? data : new Blob([data], { type:'image/jpeg' });
  } catch {
    decodeBusy = false;
    post({ type:'mirror-ack' });
    return;
  }

  createImageBitmap(blob, { imageOrientation:'none', premultiplyAlpha:'premultiply' })
    .then(bmp => {
      if (viewerShutdown) {
        bmp.close?.();
        return;
      }
      if (cvs.width !== bmp.width || cvs.height !== bmp.height) {
        cvs.width = bmp.width;
        cvs.height = bmp.height;
      }
      if (bitmapCtx) {
        bitmapCtx.transferFromImageBitmap(bmp);
        bmp.close?.();
      } else {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'copy';
        ctx.drawImage(bmp, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        bmp.close?.();
      }
    })
    .catch(e => { if (!viewerShutdown) console.warn('[canvas web] bad frame', e); })
    .finally(() => {
      decodeBusy = false;
      if (!viewerShutdown) {
        post({ type:'mirror-ack' });
        if (pendingFrame != null) drainPending();
      }
    });
}

function connectMirror() {
  if (viewerShutdown) return;
  directStreamActive = false;
  streamOutput.style.display = 'none';
  cvs.style.display = 'block';
  if (typeof BroadcastChannel !== 'function') {
    console.error('[canvas web] BroadcastChannel is unavailable in this browser');
    return;
  }
  try {
    channel = new BroadcastChannel(MIRROR_CHANNEL_NAME);
    channel.onmessage = (event) => {
      if (viewerShutdown) return;
      const message = event.data;
      if (!message || typeof message !== 'object') return;
      if (message.type === 'mirror-frame' && message.data != null) {
        // Latest-frame-wins. The sender normally keeps one frame in flight, but
        // replacement here also protects the viewer if delivery races occur.
        pendingFrame = message.data;
        if (!decodeBusy) drainPending();
      }
    };
    console.log('[canvas web] BroadcastChannel connected:', MIRROR_CHANNEL_NAME);
    post({ type:'mirror-presence' });
    presenceTimer = setInterval(() => post({ type:'mirror-presence' }), 1000);
  } catch (error) {
    channel = null;
    console.error('[canvas web] BroadcastChannel initialization failed', error);
  }
}

function shutdownViewer() {
  if (viewerShutdown) return;
  viewerShutdown = true;
  pendingFrame = null;
  if (presenceTimer) {
    clearInterval(presenceTimer);
    presenceTimer = 0;
  }
  if (autofsTimer) {
    clearTimeout(autofsTimer);
    autofsTimer = 0;
  }
  if (channel) {
    try { channel.postMessage({ type:'mirror-bye' }); } catch {}
    try { channel.onmessage = null; } catch {}
    try { channel.close(); } catch {}
  }
  channel = null;
  try { streamOutput.pause(); } catch {}
  try { streamOutput.srcObject = null; } catch {}
  if (directStreamActive && window.opener && !window.opener.closed) {
    try { window.opener.__huffReleaseCanvasStream?.(); } catch {}
  }
  directStreamActive = false;
}

window.addEventListener('pagehide', shutdownViewer, { once:true });
window.addEventListener('beforeunload', shutdownViewer, { once:true });
(async () => {
  if (!(await tryDirectCanvasStream())) connectMirror();
})();
  </script>
</body>
</html>
